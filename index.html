<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light">
<title>Gym Shop — Barcode Scanner</title>
<script src="https://unpkg.com"></script>
<style>
  html, body { forced-color-adjust: none; color-scheme: light; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: Arial, sans-serif; }
  
  #readerBox {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000; z-index: 1; overflow: hidden;
  }
  /* إزالة أي تأثيرات قد تسبب تجمد أثناء التحميل الأولي */
  #video { width: 100%; height: 100%; object-fit: cover; }
  
  #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

  .ui-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    box-sizing: border-box; padding: 20px; z-index: 3; pointer-events: none;
  }
  .ui-top { pointer-events: auto; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 12px; margin-bottom: auto; }
  .ui-bottom { pointer-events: auto; background: rgba(255,255,255,0.95); padding: 16px; border-radius: 16px 16px 0 0; margin-top: auto; box-shadow: 0 -4px 10px rgba(0,0,0,0.3); }

  h2 { color: #fff; margin: 0 0 8px 0; font-size: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); text-align: center; }
  #status { font-size: 14px; color: #00FF00; font-weight: bold; min-height: 18px; text-align: center; }
  #tips { font-size: 11px; color: #fff; margin-bottom: 10px; line-height: 1.4; text-align: center; opacity: 0.8; }
  
  input, button {
    padding: 12px; font-size: 15px; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; margin-top: 8px;
  }
  button { background: #1F4E78; color: white; border: none; font-weight: bold; cursor: pointer; }
  #torchBtn { background: #e0a800; color: #333; margin-bottom: 8px; }
</style>
</head>
<body>

  <div id="readerBox">
    <!-- إضافة سمة muted و playsinline بشكل صارم لمنع متصفحات iOS/Android من حظر الفيديو وتجميده -->
    <video id="video" autoplay loop muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="ui-container">
    <div class="ui-top">
      <h2>📷 Fullscreen Scanner</h2>
      <div id="status">Initializing...</div>
    </div>
    
    <div class="ui-bottom">
      <button type="button" id="torchBtn" style="display:none;" onclick="toggleTorch()">🔦 Toggle Flash</button>
      <div id="tips">Hold 10–15 cm away · align horizontally · ensure good lighting</div>
      
      <input type="text" id="manualCode" placeholder="Type barcode instead...">
      <button type="button" onclick="goManual()">Submit Manual Code</button>
    </div>
  </div>

<script>
  var WEB_APP_URL = 'https://google.com';

  function sendBarcode(code) {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: 'barcodeScanned', barcode: code }, '*');
      window.close();
      return;
    }
    window.location.href = WEB_APP_URL + '?barcode=' + encodeURIComponent(code);
  }

  function goManual() {
    var v = document.getElementById('manualCode').value.trim();
    if (v) sendBarcode(v);
  }

  // حل مشكلة التجمد 1: رفع الوقت بين كل فحص وفحص إلى 300ms بدلاً من 100ms لتخفيف الضغط المفاجئ على الكاميرا أثناء التشغيل
  var codeReader = new ZXing.BrowserMultiFormatReader(buildHints(), 500);
  var stopped = false;
  var currentTrack = null;

  function buildHints() {
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.QR_CODE
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    return hints;
  }

  // استخدام إعدادات قياسية جداً في البداية لضمان عمل الكاميرا بنسبة 100% دون أي تعارض
  var constraints = {
    video: {
      facingMode: { ideal: 'environment' }
    }
  };

  function startScanner() {
    stopped = false;
    document.getElementById('status').innerText = 'Starting camera stream...';
    
    // حل مشكلة التجمد 2: استخدام decodeFromConstraints القياسية للتأكد من ربط عنصر الفيديو بشكل سليم ومستقر
    codeReader.decodeFromConstraints(constraints, 'video', function (result, err) {
      if (stopped) return;

      // عند استقرار بث الفيديو، نفعّل الميزات الإضافية والـ Torch بأمان
      var videoElement = document.getElementById('video');
      if (videoElement && videoElement.readyState >= 2 && !videoElement.dataset.ready) {
        videoElement.dataset.ready = "true";
        document.getElementById('status').innerText = 'Camera active. Point at barcode.';
        setupAdvancedFeatures(videoElement);
      }

      if (result) {
        stopped = true;
        document.getElementById('status').innerText = 'Found: ' + result.getText();
        
        drawBarcodeFocus(result);
        codeReader.reset(); // إيقاف فوري وتجميد
        
        setTimeout(function() {
          sendBarcode(result.getText());
        }, 400);
      }
    }).catch(function (err) {
      console.error(err);
      document.getElementById('status').innerText = 'Camera error: ' + err + '. Trying safe fallback...';
      // محاولة تشغيل بديلة (Safe Fallback) إذا فشلت الأولى
      fallbackScanner();
    });
  }

  // دالة أمان احتياطية في حال رفض المتصفح الـ constraints المخصصة
  function fallbackScanner() {
    codeReader.decodeFromVideoDevice(undefined, 'video', function(result, err) {
      if (stopped) return;
      if (result) {
        stopped = true;
        drawBarcodeFocus(result);
        codeReader.reset();
        sendBarcode(result.getText());
      }
    });
  }

  function setupAdvancedFeatures(videoElement) {
    setTimeout(function() {
      if (!videoElement.srcObject) return;
      var tracks = videoElement.srcObject.getVideoTracks();
      if (tracks && tracks.length > 0) {
        currentTrack = tracks[0];
        var caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
        
        // تطبيق الفوكس والزووم بشكل تدريجي ناعم بعد عمل الكاميرا لتفادي التجمد
        var adv = {};
        if (caps.focusMode && caps.focusMode.includes('continuous')) adv.focusMode = 'continuous';
        if (caps.zoom) adv.zoom = Math.min(1.5, caps.zoom.max); // زووم خفيف وآمن
        
        if (Object.keys(adv).length > 0) {
          currentTrack.applyConstraints({ advanced: [adv] }).catch(function(e){});
        }
        
        if (caps.torch) {
          document.getElementById('torchBtn').style.display = 'block';
        }
      }
    }, 500);
  }

  function drawBarcodeFocus(result) {
    var video = document.getElementById('video');
    var canvas = document.getElementById('overlay');
    if (!canvas || !video) return;

    var ctx = canvas.getContext('2d');
    canvas.width = video.clientWidth;
    canvas.height = video.clientHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    var points = result.getResultPoints();
    if (!points || points.length === 0) return;

    var scaleX = video.clientWidth / video.videoWidth;
    var scaleY = video.clientHeight / video.videoHeight;

    ctx.strokeStyle = '#00FF00'; 
    ctx.lineWidth = 5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    
    if (points.length === 2) {
      ctx.moveTo(points[0].getX() * scaleX, points[0].getY() * scaleY);
      ctx.lineTo(points[1].getX() * scaleX, points[1].getY() * scaleY);
    } else {
      ctx.moveTo(points[0].getX() * scaleX, points[0].getY() * scaleY);
      for (var i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].getX() * scaleX, points[i].getY() * scaleY);
      }
      ctx.closePath();
    }
    ctx.stroke();
  }

  var torchOn = false;
  function toggleTorch() {
    if (!currentTrack) return;
    torchOn = !torchOn;
    currentTrack.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(function () {});
  }

  // تشغيل آمن عند اكتمال تحميل عناصر الصفحة
  window.addEventListener('load', startScanner);
</script>
</body>
</html>
