<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Gym Shop — Barcode Scanner</title>
<script src="https://unpkg.com/@zxing/library@latest"></script>
<style>
  html, body { forced-color-adjust: none; color-scheme: light; }
  body { font-family: Arial, sans-serif; text-align: center; padding: 16px; background: #f4f6f8; margin:0; }
  h2 { color: #1F4E78; }
  #readerBox {
    width: 100%; max-width: 420px; min-height: 320px; margin: 16px auto;
    background: #000; border-radius: 8px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  #video { width: 100%; display: block; forced-color-adjust: none; filter: none !important; }
  #guide {
    position: absolute; left: 8%; right: 8%; top: 42%; height: 16%;
    border: 3px solid #4CAF50; border-radius: 6px; pointer-events: none;
    box-shadow: 0 0 0 999px rgba(0,0,0,0.35);
  }
  #tips { font-size: 12px; color: #777; margin-top: 6px; line-height: 1.5; }
  input, button {
    padding: 12px; font-size: 15px; width: 100%; max-width: 420px; margin-top: 8px;
    box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc;
  }
  button { background: #1F4E78; color: white; border: none; font-weight: bold; }
  #status { margin-top: 12px; font-size: 13px; color: #555; min-height: 18px; }
</style>
</head>
<body>
  <h2>📷 Scan Barcode</h2>
  <div id="readerBox">
    <video id="video" autoplay playsinline muted></video>
    <div id="guide"></div>
  </div>
  <div id="status">Starting camera...</div>
  <button type="button" id="torchBtn" style="display:none; max-width:420px;" onclick="toggleTorch()">🔦 Toggle Flash</button>
  <div id="tips">Hold about 10–15 cm away · line the barcode up horizontally in the box · good lighting, no glare</div>

  <p style="margin-top:24px; color:#555; font-size:13px;">Camera not working? Type the code instead:</p>
  <input type="text" id="manualCode" placeholder="Type barcode...">
  <button onclick="goManual()">Go</button>

<script>
  // Paste your Apps Script Web App URL here — the same one used for the Add Sale page.
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbylwlHc747JcdJPoF5pgDZno2Uzhc51NX2PvAdHRB4tiN2ZLACmt5-wrJvmqzSk7yzV8Q/exec';

  function sendBarcode(code) {
    // If opened as a popup from another page (Add Product, or the Sale page's Scan button),
    // send the result straight back and close — no page navigation, no lost form data.
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: 'barcodeScanned', barcode: code }, '*');
      window.close();
      return;
    }
    // Fallback: opened as its own full tab with no opener — redirect into the Sale page.
    window.location.href = WEB_APP_URL + '?barcode=' + encodeURIComponent(code);
  }

  function goManual() {
    var v = document.getElementById('manualCode').value.trim();
    if (v) sendBarcode(v);
  }

  var codeReader = new ZXing.BrowserMultiFormatReader(buildHints(), 100); // scan every ~100ms instead of the default ~500ms
  var stopped = false;
  var currentTrack = null;

  // Limit to the barcode formats a shop actually uses — the decoder wastes time and
  // accuracy trying every possible format (QR, Data Matrix, Aztec, etc.) each frame
  // otherwise. TRY_HARDER trades a bit of speed for meaningfully better accuracy,
  // which is worth it for a one-shot manual scan.
  function buildHints() {
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.QR_CODE
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    return hints;
  }

  // facingMode: 'environment' requests the back camera directly — no device
  // enumeration, no picker, no extra permission prompts for multiple cameras.
  // Higher resolution + continuous autofocus give the decoder a sharper image to
  // work with (unsupported "advanced" constraints are simply ignored by the browser,
  // so this is safe even on devices/browsers that don't support focus control).
  var constraints = {
    video: {
      facingMode: 'environment',
      width: { ideal: 1920 },
      height: { ideal: 1080 },
      advanced: [{ focusMode: 'continuous' }, { zoom: 2.0 }]
    }
  };

  codeReader.decodeFromConstraints(constraints, 'video', function (result, err) {
    if (stopped) return;
    if (result) {
      stopped = true;
      document.getElementById('status').innerText = 'Found: ' + result.getText();
      codeReader.reset();
      sendBarcode(result.getText());
    }
    // err fires continuously while no barcode is in frame (NotFoundException) — ignore it
  }).then(function () {
    document.getElementById('status').innerText = 'Point the camera at a barcode.';
    setupTorchButton();
  }).catch(function (err) {
    document.getElementById('status').innerText =
      'Could not start the camera (' + err + '). Use manual entry below instead.';
  });

  // Show a flash toggle only if this device's back camera actually supports it.
  function setupTorchButton() {
    var video = document.getElementById('video');
    var stream = video.srcObject;
    if (!stream) return;
    var track = stream.getVideoTracks()[0];
    if (!track) return;
    var caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch) {
      currentTrack = track;
      document.getElementById('torchBtn').style.display = 'inline-block';
    }
  }

  var torchOn = false;
  function toggleTorch() {
    if (!currentTrack) return;
    torchOn = !torchOn;
    currentTrack.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(function () {});
  }
</script>
</body>
</html>
