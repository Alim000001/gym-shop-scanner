<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light">
<title>Gym Shop — Barcode Scanner</title>
<script src="https://unpkg.com/@zxing/library@latest"></script>
<style>
  html, body { forced-color-adjust: none; color-scheme: light; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: Arial, sans-serif; }
  
  /* جعل حاوية القارئ تغطي كامل الشاشة خلف العناصر */
  #readerBox {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000; z-index: 1; overflow: hidden;
  }
  #video { width: 100%; height: 100%; object-fit: cover; filter: none !important; }
  
  /* طبقة الرسم التفاعلية لتحديد الباركود المكتشف */
  #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

  /* عناصر التحكم العائمة فوق الفيديو */
  .ui-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    box-sizing: border-box; padding: 20px; z-index: 3; pointer-events: none;
  }
  .ui-top { pointer-events: auto; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 12px; margin-bottom: auto; }
  .ui-bottom { pointer-events: auto; background: rgba(255,255,255,0.95); padding: 16px; border-radius: 16px 16px 0 0; margin-top: auto; box-shadow: 0 -4px 10px rgba(0,0,0,0.3); }

  h2 { color: #fff; margin: 0 0 8px 0; font-size: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); text-align: center; }
  #status { font-size: 14px; color: #00FF00; font-weight: bold; min-height: 18px; text-align: center; }
  #tips { font-size: 11px; color: #fff; margin-bottom: 10px; line-height: 1.4; text-align: center; opacity: 0.8; }
  
  input, button {
    padding: 12px; font-size: 15px; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; margin-top: 8px;
  }
  button { background: #1F4E78; color: white; border: none; font-weight: bold; cursor: pointer; }
  #torchBtn { background: #e0a800; color: #333; margin-bottom: 8px; }
</style>
</head>
<body>

  <!-- حاوية الشاشة الكاملة للكاميرا والكانفاس الذكي -->
  <div id="readerBox">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <!-- الواجهة العائمة فوق الكاميرا -->
  <div class="ui-container">
    <div class="ui-top">
      <h2>📷 Fullscreen Scanner</h2>
      <div id="status">Starting camera...</div>
    </div>
    
    <div class="ui-bottom">
      <button type="button" id="torchBtn" style="display:none;" onclick="toggleTorch()">🔦 Toggle Flash</button>
      <div id="tips">Hold 10–15 cm away · align horizontally · ensure good lighting</div>
      
      <input type="text" id="manualCode" placeholder="Type barcode instead...">
      <button type="button" onclick="goManual()">Submit Manual Code</button>
    </div>
  </div>

<script>
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbylwlHc747JcdJPoF5pgDZno2Uzhc51NX2PvAdHRB4tiN2ZLACmt5-wrJvmqzSk7yzV8Q/exec';

  function sendBarcode(code) {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: 'barcodeScanned', barcode: code }, '*');
      window.close();
      return;
    }
    window.location.href = WEB_APP_URL + '?barcode=' + encodeURIComponent(code);
  }

  function goManual() {
    var v = document.getElementById('manualCode').value.trim();
    if (v) sendBarcode(v);
  }

  var codeReader = new ZXing.BrowserMultiFormatReader(buildHints(), 100);
  var stopped = false;
  var currentTrack = null;

  function buildHints() {
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.QR_CODE
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    return hints;
  }

  // الإصلاح الأول: نطاق دقة مرن لمنع تجميد الشاشة نهائياً عند الفتح
  var constraints = {
    video: {
      facingMode: 'environment',
      width: { min: 640, ideal: 1280, max: 1920 },
      height: { min: 480, ideal: 720, max: 1080 }
    }
  };

  // الإصلاح الثاني: تفعيل الزووم والفوكس بأمان تام كخطوة ثانية بعد تفعيل الفيديو
  function applyAdvancedSettings(videoElement) {
    setTimeout(function() {
      if (!videoElement.srcObject) return;
      var tracks = videoElement.srcObject.getVideoTracks();
      if (tracks && tracks.length > 0) {
        var track = tracks[0];
        var caps = track.getCapabilities ? track.getCapabilities() : {};
        var advancedConstraints = {};

        if (caps.focusMode && caps.focusMode.includes('continuous')) {
          advancedConstraints.focusMode = 'continuous';
        }
        if (caps.zoom) {
          // التقريب بمقدار 2X أو الحد الأقصى المتوفر بأمان لسهولة القراءة من بعيد
          advancedConstraints.zoom = Math.min(2.0, caps.zoom.max);
        }

        if (Object.keys(advancedConstraints).length > 0) {
          track.applyConstraints({ advanced: [advancedConstraints] })
            .catch(function(e) { console.log("Advanced features skipped:", e); });
        }
      }
    }, 350); // ربع ثانية لمنع اصطدام التهيئات بالمتصفح
  }

  // رسم وتثبيت مربع التركيز الأخضر بدقة الشاشة الكاملة المعروضة (object-fit: cover)
  function drawBarcodeFocus(result) {
    var video = document.getElementById('video');
    var canvas = document.getElementById('overlay');
    if (!canvas || !video) return;

    var ctx = canvas.getContext('2d');
    canvas.width = video.clientWidth;
    canvas.height = video.clientHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    var points = result.getResultPoints();
    if (!points || points.length === 0) return;

    // احتساب أبعاد العرض المطابقة للـ Fullscreen بدقة
    var scaleX = video.clientWidth / video.videoWidth;
    var scaleY = video.clientHeight / video.videoHeight;

    ctx.strokeStyle = '#00FF00'; 
    ctx.lineWidth = 5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    
    if (points.length === 2) {
      ctx.moveTo(points[0].getX() * scaleX, points[0].getY() * scaleY);
      ctx.lineTo(points[1].getX() * scaleX, points[1].getY() * scaleY);
    } else {
      ctx.moveTo(points[0].getX() * scaleX, points[0].getY() * scaleY);
      for (var i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].getX() * scaleX, points[i].getY() * scaleY);
      }
      ctx.closePath();
    }
    ctx.stroke();
  }

  // بدء الفحص
  codeReader.decodeFromConstraints(constraints, 'video', function (result, err) {
    if (stopped) return;

    // بمجرد تشغيل إطارات البث الفعلي، يتم تطبيق خصائص التقريب لمرة واحدة
    var videoElement = document.getElementById('video');
    if (videoElement && videoElement.readyState >= 2 && !videoElement.dataset.ready) {
      videoElement.dataset.ready = "true";
      applyAdvancedSettings(videoElement);
      setupTorchButton();
    }

    if (result) {
      stopped = true;
      document.getElementById('status').innerText = 'Found: ' + result.getText();
      
      // 1. رسم وتثبيت الفوكس الأخضر بدقة فوق الكود المكتشف
      drawBarcodeFocus(result);
      
      // 2. تجميد فوري لعدسة الكاميرا وإيقاف المحرك الخلفي
      codeReader.reset();
      
      // 3. إرسال البيانات فوراً
      setTimeout(function() {
        sendBarcode(result.getText());
      }, 400); // تأخير بلمحة بصر ليتمكن المستخدم من رؤية نجاح القراءة المربعة وثبات الشاشة
    }
  }).then(function () {
    document.getElementById('status').innerText = 'Point at a barcode (Fullscreen Enabled).';
  }).catch(function (err) {
    document.getElementById('status').innerText =
      'Could not start the camera (' + err + '). Use manual entry instead.';
  });

  function setupTorchButton() {
    var video = document.getElementById('video');
    var stream = video.srcObject;
    if (!stream) return;
    var track = stream.getVideoTracks()[0];
    if (!track) return;
    var caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch) {
      currentTrack = track;
      document.getElementById('torchBtn').style.display = 'block';
    }
  }

  var torchOn = false;
  function toggleTorch() {
    if (!currentTrack) return;
    torchOn = !torchOn;
    currentTrack.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(function () {});
  }
</script>
</body>
</html>
