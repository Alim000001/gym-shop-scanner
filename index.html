<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym Shop — Barcode Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; text-align: center; padding: 16px; background: #f4f6f8; margin:0; }
  h2 { color: #1F4E78; }
  #reader {
    width: 100%; max-width: 420px; min-height: 320px; margin: 16px auto;
    position: relative; background: #000; border-radius: 8px;
  }
  #reader video { width: 100% !important; border-radius: 8px; }
  input, button {
    padding: 12px; font-size: 15px; width: 100%; max-width: 420px; margin-top: 8px;
    box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc;
  }
  button { background: #1F4E78; color: white; border: none; font-weight: bold; }
  #status { margin-top: 12px; font-size: 13px; color: #555; min-height: 18px; }
</style>
</head>
<body>
  <h2>📷 Scan Barcode</h2>
  <div id="reader"></div>
  <div id="status">Starting camera...</div>

  <p style="margin-top:24px; color:#555; font-size:13px;">Camera not working? Type the code instead:</p>
  <input type="text" id="manualCode" placeholder="Type barcode...">
  <button onclick="goManual()">Go</button>

<script>
  // Paste your Apps Script Web App URL here — the same one used for the Add Sale page.
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbylwlHc747JcdJPoF5pgDZno2Uzhc51NX2PvAdHRB4tiN2ZLACmt5-wrJvmqzSk7yzV8Q/exec';

  function sendBarcode(code) {
    window.location.href = WEB_APP_URL + '?barcode=' + encodeURIComponent(code);
  }

  function goManual() {
    var v = document.getElementById('manualCode').value.trim();
    if (v) sendBarcode(v);
  }

  var scanner = new Html5Qrcode('reader');
  var stopped = false;

  function onDetected(decodedText) {
    if (stopped) return;
    stopped = true;
    document.getElementById('status').innerText = 'Found: ' + decodedText;
    scanner.stop().then(function () {
      sendBarcode(decodedText);
    }).catch(function () {
      sendBarcode(decodedText); // proceed even if stop() cleanup fails
    });
  }

  // { facingMode: "environment" } requests the back camera directly —
  // no device list, no picker, no per-camera permission prompts.
  scanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    onDetected,
    function () { /* fires continuously while no barcode is in frame — ignore */ }
  ).then(function () {
    document.getElementById('status').innerText = 'Point the camera at a barcode.';
  }).catch(function (err) {
    document.getElementById('status').innerText =
      'Could not start the camera (' + err + '). Use manual entry below instead.';
  });
</script>
</body>
</html>
